[project]
name = "psautomater"
version = "1.0.0"
description = "A Photoshop Editing Automation Tool for bulk editing."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastexcel>=0.20.2",
    "loguru>=0.7.3",
    "nodegraphqt>=0.6.40",
    "numpy>=2.4.0",
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.11.0",
    "photoshop-python-api>=0.24.2 ; sys_platform == 'win32'",
    "pillow>=11.0.0",
    "polars>=1.43.2",
    "psd-tools[composite]>=1.18.0",
    "pyside6>=6.11.1",
    "rembg>=2.0.78",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "nuitka>=4.1.3",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.black]
target-version = ["py314"]

[tool.pylint.main]
py-version = "3.14"
extension-pkg-allow-list = ["PySide6", "cv2"]

[tool.pylint.typecheck]
ignored-modules = [
    "NodeGraphQt",
    "PySide6",
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtSvg",
    "PySide6.QtWidgets",
    "comtypes",
    "cv2",
    "photoshop",
]

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-attributes = 16
max-locals = 25

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cache-clear --color=yes --code-highlight=yes --cov --cov-branch --cov-report=term --cov-report=xml -vvv"
testpaths = ["tests"]

[tool.coverage.run]
source = ["psautomater"]
